name: Build APK
on:
  push:
    branches: [main, foxy-engine]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ln -sf "$(which python3)" /usr/local/bin/python || true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build Foxy sing-box (Vauth/sing-box v1.0.0-masque)
        run: |
          git clone --depth 1 --branch v1.0.0-masque https://github.com/Vauth/sing-box.git "$RUNNER_TEMP/foxybox"
          cd "$RUNNER_TEMP/foxybox"
          test "$(git rev-parse HEAD)" = 9be46c8d5c37b5832a879ec78b2c8d75f3286c20
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -tags with_quic,with_utls -ldflags "-s -w -buildid=" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libfoxybox.so" ./cmd/sing-box
          ls -l "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libfoxybox.so"
          sha256sum "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libfoxybox.so"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=simorgh\nkeyPassword=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing/signing.properties"
      - name: Assemble release
        env:
          SIGNING_PROPERTIES: ${{ runner.temp }}/signing/signing.properties
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Simorgh-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --title "Simorgh $GITHUB_REF_NAME" --generate-notes
      - name: Publish APK to apk-builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/release/*.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk-builds
          git -c user.name=simorgh-ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=simorgh-ci -c user.email=ci@users.noreply.github.com commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds
